name: IEC passthrough test build

on:
  push:
    branches: [audio-iec-dtshd]
  workflow_dispatch:

concurrency:
  group: iec-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/build-cache-1
            app/.cxx
          key: iec-build-cache-${{ runner.os }}-${{ github.sha }}
          restore-keys: iec-build-cache-${{ runner.os }}-

      - name: Prepare local properties
        run: |
          touch local.properties
          touch local.dev.properties

      - name: Prepare CI signing config
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/ci-debug.jks" \
            -storepass android -alias androiddebugkey -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          {
            echo "NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/ci-debug.jks"
            echo "NUVIO_RELEASE_KEY_ALIAS=androiddebugkey"
            echo "NUVIO_RELEASE_KEY_PASSWORD=android"
            echo "NUVIO_RELEASE_STORE_PASSWORD=android"
          } >> "$GITHUB_ENV"

      - name: Fit Gradle into the 7 GB runner
        run: |
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8/' gradle.properties
          echo "kotlin.daemon.jvmargs=-Xmx2g" >> gradle.properties
          echo "org.gradle.workers.max=2" >> gradle.properties
          echo "org.gradle.caching=true" >> gradle.properties
          # Fire TV Stick is armeabi-v7a only: skip the other three ABIs (and their NDK builds).
          sed -i 's/include("armeabi-v7a", "arm64-v8a", "x86", "x86_64")/include("armeabi-v7a")/' app/build.gradle.kts
          sed -i 's/isUniversalApk = true/isUniversalApk = false/' app/build.gradle.kts
          grep -n 'include("armeabi-v7a")' app/build.gradle.kts
          free -h; df -h /

      - name: Build fullDebug APK
        run: ./gradlew :app:assembleFullDebug --stacktrace --no-daemon

      - name: List APKs
        run: find app/build/outputs/apk -name '*.apk' -exec ls -la {} \;

      - uses: actions/upload-artifact@v4
        with:
          name: nuvio-iec-armeabi-v7a
          path: app/build/outputs/apk/full/debug/*armeabi-v7a*.apk
          if-no-files-found: error
