name: IEC passthrough test build

on:
  push:
    branches: [dev, 'feat/**', audio-iec-tunnel]
  workflow_dispatch:

concurrency:
  group: iec-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/build-cache-1
            app/.cxx
          key: iec-build-cache-${{ runner.os }}-${{ github.sha }}
          restore-keys: iec-build-cache-${{ runner.os }}-

      - name: Prepare local properties
        run: |
          touch local.properties
          touch local.dev.properties

      - name: Prepare signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.NUVIO_IEC_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.NUVIO_IEC_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NUVIO_IEC_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            # Fixed test keystore so every build installs over the previous one.
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ci-debug.jks"
            ALIAS="$KEY_ALIAS"; PASS="$KEY_PASSWORD"
          else
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/ci-debug.jks" \
              -storepass android -alias androiddebugkey -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
            ALIAS=androiddebugkey; PASS=android
          fi
          {
            echo "NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/ci-debug.jks"
            echo "NUVIO_RELEASE_KEY_ALIAS=$ALIAS"
            echo "NUVIO_RELEASE_KEY_PASSWORD=$PASS"
            echo "NUVIO_RELEASE_STORE_PASSWORD=$PASS"
          } >> "$GITHUB_ENV"

      - name: Fit Gradle into the 7 GB runner
        run: |
          # One JVM for Gradle, Kotlin and D8: the runner has 7 GB, two daemons do not fit.
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8/' gradle.properties
          echo "kotlin.compiler.execution.strategy=in-process" >> gradle.properties
          echo "org.gradle.workers.max=2" >> gradle.properties
          echo "org.gradle.caching=true" >> gradle.properties
          # Fire TV Stick is armeabi-v7a only: skip the other three ABIs (and their NDK builds).
          sed -i 's/include("armeabi-v7a", "arm64-v8a", "x86", "x86_64")/include("armeabi-v7a")/' app/build.gradle.kts
          sed -i 's/isUniversalApk = true/isUniversalApk = false/' app/build.gradle.kts
          grep -n 'include("armeabi-v7a")' app/build.gradle.kts
          free -h; df -h /

      - name: Build fullDebug APK
        run: ./gradlew :app:assembleFullDebug --stacktrace --no-daemon

      - name: Unit tests (subtitle timing matcher)
        run: ./gradlew :app:testFullDebugUnitTest --tests "*SubtitleTimingMatcherTest*" --stacktrace --no-daemon

      - name: List APKs
        run: find app/build/outputs/apk -name '*.apk' -exec ls -la {} \;

      - uses: actions/upload-artifact@v4
        with:
          name: nuvio-iec-armeabi-v7a
          path: app/build/outputs/apk/full/debug/*armeabi-v7a*.apk
          if-no-files-found: error
